# fzf
".local/bin/fzf":
  type: "archive"
  url: "https://github.com/junegunn/fzf/releases/latest/download/fzf-{{ .chezmoi.os }}_{{ .chezmoi.arch }}.tar.gz"
  exact: true
  executable: true

# fd
{{ if eq .chezmoi.os "darwin" }}
".local/bin/fd":
  type: "archive"
  url: "https://github.com/sharkdp/fd/releases/download/latest"
  exact: true
  stripComponents: 1
  executable: true
{{ else }}
".local/bin/fd":
  type: "archive"
  url: "https://github.com/sharkdp/fd/releases/download/v10.2.0/fd-v10.2.0-x86_64-unknown-linux-musl.tar.gz"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}

