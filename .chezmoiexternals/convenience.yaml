{{ if not .data.brew.enable }}
{{ if has .data.convenience_tools "fzf" }}
"{{ .data.base_path }}/bin/fzf":
  type: "archive"
  url: "https://github.com/junegunn/fzf/releases/latest/download/fzf-{{ .chezmoi.os }}_{{ .chezmoi.arch }}.tar.gz"
  exact: true
  executable: true
{{ end }}

{{ if has .data.convenience_tools "fd" }}
"{{ .data.base_path }}/bin/fd":
  type: "archive"
  url: "https://github.com/sharkdp/fd/releases/latest/download/fd-{{ .chezmoi.arch }}-unknown-linux-musl.tar.gz"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}

{{ if has .data.convenience_tools "lazygit" }}
"{{ .data.base_path }}/bin/lazygit":
  type: "archive"
  url: "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_{{ .chezmoi.os }}_{{ .chezmoi.arch }}.tar.gz"
  exact: true
  executable: true
{{ end }}

{{ if has .data.convenience_tools "yazi" }}
"{{ .data.base_path }}/bin/yazi":
  type: "archive"
  url: "https://github.com/sxyazi/yazi/releases/latest/download/yazi-{{ .chezmoi.arch }}-unknown-linux-gnu.zip"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}

{{ if has .data.convenience_tools "gh" }}
"{{ .data.base_path }}/bin/gh":
  type: "archive"
  url: "https://github.com/cli/cli/releases/latest/download/gh_{{ .chezmoi.arch }}.tar.gz"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}

{{ if has .data.convenience_tools "tmux" }}
"{{ .data.base_path }}/bin/tmux":
  type: "archive"
  url: "https://github.com/tmux/tmux/releases/latest/download/tmux-{{ .chezmoi.arch }}-unknown-linux-musl.tar.gz"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}

{{ if has .data.convenience_tools "ripgrep" }}
"{{ .data.base_path }}/bin/rg":
  type: "archive"
  url: "https://github.com/BurntSushi/ripgrep/releases/latest/download/ripgrep-{{ .chezmoi.arch }}-unknown-linux-musl.tar.gz"
  exact: true
  stripComponents: 1
  executable: true
{{ end }}
{{ end }}
