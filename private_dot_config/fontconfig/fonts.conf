<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">~/.config/fontconfig/nerd-font-symbols.conf</include>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>Symbols Nerd Font Mono</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>Consolas</family>
    <prefer>
      <family>Consolas</family>
      <family>Symbols Nerd Font Mono</family>
      <family>LXGW WenKai Mono</family>
    </prefer>
  </alias>
</fontconfig>
