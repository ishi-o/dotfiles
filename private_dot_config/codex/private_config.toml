# model = "gpt-5.6-luna"
# model_provider = "openai"

model = "glm-5.3"
model_provider = "ZAI"
model_catalog_json = "~/.config/codex/models.json"

model_reasoning_effort = "max"

approvals_reviewer = "user"

[model_providers.ZAI]
name = "ZAI"
base_url = "https://open.bigmodel.cn/api/v1"
env_key = "GLM_API_KEY"
wire_api = "responses"

[tui]
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[mcp_servers.mcphub]
command = "npx"
args = [
  "-y",
  "mcp-remote",
  "http://127.0.0.1:37373/mcp",
  "--transport",
  "sse-only",
  "--allow-http",
]

[plugins."superpowers@openai-curated"]
enabled = true
